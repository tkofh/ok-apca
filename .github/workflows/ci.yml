name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs declare exactly what they need.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Check, build, test, typecheck
    runs-on: ubuntu-latest
    # The official Playwright image ships Chromium and its system libraries,
    # so the browser tests need no apt or `playwright install` step. Keep the
    # tag in step with the `playwright` devDependency in packages/ok-apca.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      # The image installs browsers here. turbo's strict env mode strips the
      # variable from task environments unless turbo.json passes it through
      # (see the `test` task), so set it explicitly and keep both in step.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Reads the pinned pnpm version from the root package.json "packageManager" field.
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # check:report is the read-only biome run; `check` would write fixes.
      - name: Check, build, test, typecheck
        run: pnpm turbo run //#check:report build test typecheck
