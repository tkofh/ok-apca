# Release automation via Changesets + npm trusted publishing (OIDC).
# See RELEASING.md for the one-time GitHub/npm setup and the day-to-day flow.
#
# Job 1 (changesets) runs on every push to main: it maintains the
# "Version Packages" PR and decides whether a publish is due.
# Job 2 (publish) only runs when the version on main is absent from npm,
# and is gated behind the `release` environment (required reviewer).
name: Release

on:
  push:
    branches: [main]

# Least privilege: jobs declare exactly what they need.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  changesets:
    name: Version PR / publish gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the changeset-release/main branch
      pull-requests: write # open/update the Version Packages PR
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
      needs-publish: ${{ steps.gate.outputs.needs-publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so Changesets attributes changelog entries to the right commits.
          fetch-depth: 0

      # Runs before changesets/action, which leaves the work tree on the
      # version branch with bumped package.json files.
      - name: Check whether the version on main is unpublished
        id: gate
        run: |
          needs=false
          for dir in packages/ok-apca; do
            name="$(jq -r .name "$dir/package.json")"
            version="$(jq -r .version "$dir/package.json")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already on npm"
            else
              echo "${name}@${version} is not on npm yet"
              needs=true
            fi
          done
          echo "needs-publish=${needs}" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Maintain Version Packages PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # The action pushes through the GitHub API by default, so the
          # commit is GPG-signed by GitHub.
          version-script: pnpm exec changeset version

  publish:
    name: Publish to npm
    needs: changesets
    # Publish only when the Version Packages PR has been merged: no unconsumed
    # changesets remain AND the version on main is missing from the registry.
    if: needs.changesets.outputs.has-changesets == 'false' && needs.changesets.outputs.needs-publish == 'true'
    runs-on: ubuntu-latest
    # Same image as CI: Chromium preinstalled for the browser tests. Keep the
    # tag in step with the `playwright` devDependency in packages/ok-apca.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      # The image installs browsers here, but the runner replaces HOME and the
      # image's PLAYWRIGHT_BROWSERS_PATH does not reach the steps, so Playwright
      # otherwise looks under /github/home/.cache/ms-playwright and finds nothing.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    environment:
      name: release
      url: https://www.npmjs.com/package/ok-apca
    permissions:
      contents: write # changesets/action pushes git tags and creates the GitHub Release
      id-token: write # OIDC token exchange for npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1. Fail loudly instead of pulling
      # a newer npm from the registry; bump .node-version if this trips.
      - name: Require npm with trusted-publishing support
        run: |
          required=11.5.1
          current="$(npm --version)"
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "npm ${current} predates trusted publishing support (need >= ${required})" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Version Packages PR is opened by GITHUB_TOKEN, so CI never runs on
      # it; this is the verification gate for the exact tree being published.
      - name: Check, build, test, typecheck
        run: pnpm turbo run //#check:report build test typecheck

      - name: Publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Release tags go through the GitHub API (the default), so they are
          # GPG-signed too.
          publish-script: pnpm exec changeset publish
        env:
          # Redundant under trusted publishing (provenance is on by default),
          # but forces a hard failure if publishing ever falls back to a path
          # that cannot attest provenance.
          NPM_CONFIG_PROVENANCE: 'true'
